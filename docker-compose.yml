version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: sentinelfusion_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelfusion}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MQTT Broker Service (Eclipse Mosquitto)
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: sentinelfusion_mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./backend/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # 3. SentinelFusion AI Backend Service (FastAPI + YOLOv8 + EasyOCR)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelfusion_backend
    restart: always
    environment:
      - PROJECT_NAME=SentinelFusion AI
      - VERSION=1.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sentinelfusion
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started

  # 4. Command Center Frontend Service (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelfusion_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
